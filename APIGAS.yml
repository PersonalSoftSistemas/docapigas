          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcionamentoReduzido'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Evento lançado com sucesso
          content: {}
        "404":
          description: Evento inexistente
          content: {}
        "500":
          description: Erro geral
          content: {}
      x-codegen-request-body-name: value
  /api/Localizacao/Email/{Contrato}:
