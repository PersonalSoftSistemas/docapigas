      tags:
      - Evento
      operationId: Evento_ListaEventos
      responses:
        "200":
          description: Lista de Eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/clsBase'
            text/json:
              schema:
                type: array
