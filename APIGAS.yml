openapi: 3.0.0
info:
  version: v1
  title: webapigestaoassessorias
  description: API de integração para Gestão de Assessoria – GAS. Contempla Carga,
    Acordo, Negociação, Contato, Localização, Pagamento, Retirada e Eventos.
paths:
  "/api/acesso/token/{modulo}/{acesso}/{senha}":
    get:
      tags:
        - Acesso
      summary: Geração de token de acesso
      description: Rotina para gerar o token de acesso à empresa.
      operationId: Acesso_Token
      parameters:
        - name: modulo
          in: path
          description: Código que identifica um sistema da Personalsoft.
          required: true
          schema:
            type: integer
            format: int32
        - name: acesso
          in: path
          description: Email ou nome do usuário (naUsuario).
          required: true
          schema:
            type: string
        - name: senha
          in: path
          description: Senha de acesso.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AccessToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
            text/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Acordo:
    get:
      tags:
        - Acordo
      summary: Listar acordos
      description: Gera lista de acordos realizados no credor para envio à assessoria
        do usuário conectado.
      operationId: Acordo_Get
      responses:
        "200":
          description: Acordos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IRetornoAcordo"
            text/json:
              schema:
                $ref: "#/components/schemas/IRetornoAcordo"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Acordo/{acesso}":
    get:
      tags:
        - Acordo
      summary: Listar acordos por acesso
      description: Gera lista de acordos realizados no credor para envio à assessoria
        do usuário conectado.
      operationId: Acordo_AcordoLogin
      parameters:
        - name: acesso
          in: path
          description: Login do usuário; deve ser o mesmo do token.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acordos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IRetornoAcordo"
            text/json:
              schema:
                $ref: "#/components/schemas/IRetornoAcordo"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Carga:
    get:
      tags:
        - Carga
      summary: Consultar cargas
      description: Gera lista de dívidas da assessoria para o usuário conectado.
      operationId: Carga_Get
      responses:
        "200":
          description: Cargas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IRetornoDivida"
            text/json:
              schema:
                $ref: "#/components/schemas/IRetornoDivida"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Carga/{acesso}":
    get:
      tags:
        - Carga
      summary: Consultar cargas por acesso
      description: Gera lista de dívidas da assessoria para o usuário conectado.
      operationId: Carga_CargaLogin
      parameters:
        - name: acesso
          in: path
          description: Login do usuário; deve ser o mesmo do token.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cargas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IRetornoDivida"
            text/json:
              schema:
                $ref: "#/components/schemas/IRetornoDivida"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Contato/Telefones/{inscricao}":
    get:
      tags:
        - Contato
      summary: Listar telefones do devedor
      description: "Lista os telefones do CPF/CNPJ da carteira da assessoria, com a
        situação de cada um no Adaptor: 1 - Validado, 2 - Falta validar, 3 -
        Negativado."
      operationId: Contato_Telefones
      parameters:
        - name: inscricao
          in: path
          description: CPF ou CNPJ, com ou sem máscara
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telefones do CPF/CNPJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdTelefoneAssessoria"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdTelefoneAssessoria"
        "400":
          description: "Inscrição inválida: informe o CPF ou o CNPJ com números"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Contato/Enderecos/{inscricao}":
    get:
      tags:
        - Contato
      summary: Listar endereços do devedor
      description: "Lista os endereços do CPF/CNPJ da carteira da assessoria, com a
        situação de cada um no Adaptor: 1 - Validado, 2 - Falta validar, 3 -
        Negativado."
      operationId: Contato_Enderecos
      parameters:
        - name: inscricao
          in: path
          description: CPF ou CNPJ, com ou sem máscara
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Endereços do CPF/CNPJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdEnderecoAssessoria"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdEnderecoAssessoria"
        "400":
          description: "Inscrição inválida: informe o CPF ou o CNPJ com números"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Contato/Emails/{inscricao}":
    get:
      tags:
        - Contato
      summary: Listar e-mails do devedor
      description: "Lista os e-mails do CPF/CNPJ da carteira da assessoria, com a
        situação de cada um no Adaptor: 1 - Validado, 2 - Falta validar, 3 -
        Negativado."
      operationId: Contato_Emails
      parameters:
        - name: inscricao
          in: path
          description: CPF ou CNPJ, com ou sem máscara
          required: true
          schema:
            type: string
      responses:
        "200":
          description: E-mails do CPF/CNPJ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdEmailAssessoria"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdEmailAssessoria"
        "400":
          description: "Inscrição inválida: informe o CPF ou o CNPJ com números"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Evento:
    get:
      tags:
        - Evento
      summary: Listar eventos
      description: Lista os eventos permitidos para uso da assessoria.
      operationId: Evento_ListaEventos
      responses:
        "200":
          description: Lista de Eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
        "400":
          description: Sem Evento configurado
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Evento/Acionamento/{Contrato}":
    post:
      tags:
        - Evento
      summary: Lançar evento na dívida
      description: Registra um acionamento (evento) na dívida do contrato informado.
      operationId: Evento_SalvarReduzido
      parameters:
        - name: Contrato
          in: path
          description: Chave da dívida desejada
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcionamentoReduzido"
          text/json:
            schema:
              $ref: "#/components/schemas/AcionamentoReduzido"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AcionamentoReduzido"
        description: Corpo do evento
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Evento lançado com sucesso
        "404":
          description: Evento inexistente
        "500":
          description: Erro geral
  "/api/Localizacao/Email/{Contrato}":
    post:
      tags:
        - LocalizacaoEmail
      summary: Cadastrar e-mail do cliente
      description: Salva um e-mail para o cliente do contrato informado.
      operationId: Localizacao_SalvarEmail
      parameters:
        - name: Contrato
          in: path
          description: Chave da dívida desejada
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdEmail"
          text/json:
            schema:
              $ref: "#/components/schemas/MdEmail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MdEmail"
        description: E-mail
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Email criado com sucesso
        "400":
          description: E-mail informado não estão em um padrão válido
        "500":
          description: Erro geral
  /api/Localizacao/Telefone/TipoTelefone:
    get:
      tags:
        - LocalizacaoTelefone
      summary: Tipos de telefone
      description: Lista os tipos de telefone permitidos para uso da assessoria.
      operationId: Localizacao_ListaTipoTelefone
      responses:
        "200":
          description: Lista de Tipo Telefones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
        "400":
          description: Sem tipo de telefone configurado
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Localizacao/Telefone/{Contrato}":
    post:
      tags:
        - LocalizacaoTelefone
      summary: Cadastrar telefone do cliente
      description: Salva um telefone para o cliente do contrato informado.
      operationId: Localizacao_SalvarTelefone
      parameters:
        - name: Contrato
          in: path
          description: Chave da dívida desejada
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdTelefone"
          text/json:
            schema:
              $ref: "#/components/schemas/MdTelefone"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MdTelefone"
        description: Telefone
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Telefone criado com sucesso
        "400":
          description: Erro ao salvar Telefone do cliente DDD e Telefone já cadastrado
            para este cliente
        "500":
          description: Erro geral
  /api/Localizacao/Endereco/TipoEndereco:
    get:
      tags:
        - LocalizacaoEndereco
      summary: Tipos de endereço
      description: Lista os tipos de endereço permitidos para uso da assessoria.
      operationId: Localizacao_ListaTipoEndereco
      responses:
        "200":
          description: Lista de Tipo Endereço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
        "400":
          description: Sem tipo de Endereço configurado
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Localizacao/Endereco/{Contrato}":
    post:
      tags:
        - LocalizacaoEndereco
      summary: Cadastrar endereço do cliente
      description: Salva um endereço para o cliente do contrato informado.
      operationId: Localizacao_SalvarEndereco
      parameters:
        - name: Contrato
          in: path
          description: Chave da dívida desejada
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdEndereco"
          text/json:
            schema:
              $ref: "#/components/schemas/MdEndereco"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MdEndereco"
        description: Endereço
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Endereço criado com sucesso
        "400":
          description: UF inválida
        "500":
          description: Erro geral
  "/api/Negociacao/TiposAcordo/{ChaveDivida}":
    get:
      tags:
        - Negociacao
      summary: Tipos de acordo elegíveis
      description: Lista os tipos de acordo disponíveis para negociação da dívida.
      operationId: Negociacao_TiposAcordo
      parameters:
        - name: ChaveDivida
          in: path
          description: Chave da dívida
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista tipo de acordos elegíveis para negociacao
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/clsBase"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Negociacao/ObterOrigens/{Contrato}":
    get:
      tags:
        - Negociacao
      summary: Origens da dívida
      description: Lista as parcelas e dívidas elegíveis para negociação.
      operationId: Negociacao_ObterOrigens
      parameters:
        - name: Contrato
          in: path
          description: código do contrato de dívida
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista das parcelas e dividas elegíveis para negociacao
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdDividaOrigem"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MdDividaOrigem"
        "400":
          description: Sem Dívida não encontrada
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Negociacao/Simular:
    post:
      tags:
        - Negociacao
      summary: Simular negociação
      description: Simula uma opção de acordo conforme o objeto enviado. O IdSimulacao
        retornado é usado na aprovação.
      operationId: Negociacao_Simular
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdSimulacao"
          text/json:
            schema:
              $ref: "#/components/schemas/MdSimulacao"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MdSimulacao"
        description: Objeto de simulação
        required: true
      responses:
        "200":
          description: Dados da Simulação para posteriormente formalizar um acordo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdRetornoSimulacao"
            text/json:
              schema:
                $ref: "#/components/schemas/MdRetornoSimulacao"
        "400":
          description: Contrato -Número do  Contrato- está em negociação com outro
            usuário, tente novamente mais tarde
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Negociacao/AprovarSimulacao/{IdSimulacao}":
    post:
      tags:
        - Negociacao
      summary: Aprovar simulação
      description: Uma vez simulado o acordo, ele é aprovado através do id único da
        simulação.
      operationId: Negociacao_AprovarSimulacao
      parameters:
        - name: IdSimulacao
          in: path
          description: id da simulação realizada
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MdAprovaAcordo"
          text/json:
            schema:
              $ref: "#/components/schemas/MdAprovaAcordo"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MdAprovaAcordo"
        description: Dados do Login de Aprovacao
        required: true
      responses:
        "200":
          description: Acordo Aprovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdRetonoAcordo"
            text/json:
              schema:
                $ref: "#/components/schemas/MdRetonoAcordo"
        "400":
          description: Proposta vencida, realize nova simulação
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Negociacao/Acordo/{ChaveNegociacao}":
    delete:
      tags:
        - Negociacao
      summary: Cancelar acordo
      description: Cancela um acordo realizado pela assessoria.
      operationId: Negociacao_CancelarAcordo
      parameters:
        - name: ChaveNegociacao
          in: path
          description: Chave de Negociação recebida durante o processo de Acordo
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Acordo Cancelado com sucesso
        "400":
          description: Não é permitido o cancelamento do acordo
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Negociacao/Acordo/Boleto/{ChaveNegociacao}/{Parcela}":
    get:
      tags:
        - Negociacao
      summary: Emitir boleto
      description: Gera o boleto da parcela do acordo.
      operationId: Negociacao_Boleto
      parameters:
        - name: ChaveNegociacao
          in: path
          description: Chave de Negociação recebida durante o processo de Acordo
          required: true
          schema:
            type: string
        - name: Parcela
          in: path
          description: Número da parcela
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Boleto Emitido com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdRetornoBoletoAssessoria"
            text/json:
              schema:
                $ref: "#/components/schemas/MdRetornoBoletoAssessoria"
        "400":
          description: "Boleto indisponível: o acordo é pago com Pix"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  "/api/Negociacao/Acordo/status/{SqAcordo}":
    get:
      tags:
        - Negociacao
      summary: Status do acordo
      description: Valida a existência de um acordo e retorna sua situação.
      operationId: Negociacao_status
      parameters:
        - name: SqAcordo
          in: path
          description: SqAcordo Recebido na negociacao
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acordo Encontrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MdDadosAcordo"
            text/json:
              schema:
                $ref: "#/components/schemas/MdDadosAcordo"
        "404":
          description: Acordo não encontrado
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
