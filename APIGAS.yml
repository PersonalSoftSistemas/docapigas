                  $ref: '#/components/schemas/clsBase'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/clsBase'
        "400":
          description: Sem tipo de Endereço configurado
          content:
            application/json:
              schema:
                type: string
            text/json:
