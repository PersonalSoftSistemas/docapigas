openapi: 3.0.1
info:
  title: webapigestaoassessorias
  description: "[![Personal](https://s3.amazonaws.com/ps.public/images/logo_PersonalSoft_horizontal_COR-e1448044980572.png)](http://www.personalsoft.net.br)<p>\
    \ Permite integração de Carga, Acordo, Pagamento, Retirada  e Eventos para Gestã\
    o de Assessoria - GAS"
  version: v1
servers:
- url: /
paths:
  /api/acesso/token/{modulo}/{acesso}/{senha}:
    get:
      tags:
      - Acesso
      operationId: Acesso_Token
      parameters:
      - name: modulo
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: acesso
        in: path
        required: true
        schema:
          type: string
      - name: senha
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: AccessToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
            text/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Acordo:
    get:
      tags:
      - Acordo
      operationId: Acordo_Get
      responses:
        "200":
          description: Acordos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Acordo/{acesso}:
    get:
      tags:
      - Acordo
      operationId: Acordo_AcordoLogin
      parameters:
      - name: acesso
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Acordos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Carga:
