openapi: 3.0.1

info:
  title: webapigestaoassessorias
  version: v3
  description: >-
    [![Personal](https://s3.amazonaws.com/ps.public/images/logo_PersonalSoft_horizontal_COR-e1448044980572.png)](http://www.personalsoft.net.br)<p>
    Permite integração de Carga, Acordo, Pagamento, Retirada e Eventos para Gestão
    de Assessoria - GAS

servers:
  - url: http://localhost:44303

paths:

  /api/acesso/token/{modulo}/{acesso}/{senha}:
    get:
      summary: Geração de token de acesso
      tags: [Acesso]
      operationId: Acesso_Token
      parameters:
        - name: modulo
          in: path
          required: true
          schema: { type: integer, format: int32 }
        - name: acesso
          in: path
          required: true
          schema: { type: string }
        - name: senha
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: AccessToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'

  /api/Acordo:
    get:
      summary: Consulta acordos
      tags: [Acordo]
      operationId: Acordo_Get
      responses:
        '200':
          description: Acordos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'

  /api/Acordo/{acesso}:
    get:
      summary: Consulta acordos por acesso
      tags: [Acordo]
      operationId: Acordo_AcordoLogin
      parameters:
        - name: acesso
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acordos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoAcordo'

  /api/Carga:
    get:
      summary: Consulta cargas
      tags: [Carga]
      operationId: Carga_Get
      responses:
        '200':
          description: Cargas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoDivida'

  /api/Carga/{acesso}:
    get:
      summary: Consulta cargas por acesso
      tags: [Carga]
      operationId: Carga_CargaLogin
      parameters:
        - name: acesso
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cargas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoDivida'

  /api/Evento:
    get:
      summary: Lista eventos disponíveis
      tags: [Evento]
      operationId: Evento_ListaEventos
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/clsBase'

  /api/Evento/Acionamento/{Contrato}:
    post:
      summary: Lançar evento na dívida
      tags: [Evento]
      operationId: Evento_SalvarReduzido
      parameters:
        - name: Contrato
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcionamentoReduzido'
      responses:
        '204':
          description: Evento lançado com sucesso

  /api/Pagamento:
    get:
      summary: Consulta pagamentos
      tags: [Pagamento]
      operationId: Pagamento_Get
      responses:
        '200':
          description: Pagamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoPagamento'

  /api/Retirada:
    get:
      summary: Consulta retiradas
      tags: [Retirada]
      operationId: Retirada_Get
      responses:
        '200':
          description: Retiradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetirada'

components:
  schemas:

    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int32
        refresh_token:
          type: string
        username:
          type: string
        usermail:
          type: string

    IRetornoAcordo:
      type: object
      properties:
        nrProtocoloAcordo:
          type: integer
          format: int64
        solicitante:
          type: string
        Acordos:
          type: array
          items:
            $ref: '#/components/schemas/ItemAcordo'

    ItemAcordo:
      type: object
      properties:
        chaveNegociacao:
          type: string
        nrInscricao:
          type: string
        dtNegociacao:
          type: string
          format: date-time
        vrTotalAcordo:
          type: number
          format: double

    IRetornoDivida:
      type: object
      properties:
        nrProtocoloCarga:
          type: integer
          format: int64
        solicitante:
          type: string

    IRetornoPagamento:
      type: object
      properties:
        nrProtocoloPagamento:
          type: integer
          format: int64
        solicitante:
          type: string

    IRetirada:
      type: object
      properties:
        nrProtocoloRetirada:
          type: integer
          format: int64
        solicitante:
          type: string

    clsBase:
      type: object
      properties:
        codigo:
          type: integer
        nome:
          type: string
        InDesativado:
          type: boolean

    AcionamentoReduzido:
      type: object
      properties:
        CodigoEvento:
          type: integer
        DataHoraOcorrencia:
          type: string
          format: date-time
        DsNotas:
          type: string
