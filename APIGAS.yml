                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Pagamento/{acesso}:
    get:
      tags:
      - Pagamento
      operationId: Pagamento_PagamentoLogin
      parameters:
      - name: acesso
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Pagamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoPagamento'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetornoPagamento'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Retirada:
    get:
      tags:
      - Retirada
      operationId: Retirada_Get
      responses:
        "200":
          description: Retiradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetirada'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetirada'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Retirada/{acesso}:
    get:
      tags:
      - Retirada
      operationId: Retirada_RetiradaLogin
      parameters:
      - name: acesso
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Retiradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetirada'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetirada'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int32
        refresh_token:
          type: string
        username:
          type: string
        usermail:
          type: string
    IRetornoAcordo:
      type: object
      properties:
        nrProtocoloAcordo:
          type: integer
          format: int64
        solicitante:
          type: string
        Acordos:
          type: array
          items:
            $ref: '#/components/schemas/ItemAcordo'
    ItemAcordo:
      type: object
      properties:
        nrInscricao:
          type: string
        dtNegociacao:
          type: string
          format: date-time
        dtCorrigirAte:
          type: string
          format: date-time
        cdAcionador:
          type: integer
          format: int32
        sqAcordo:
          type: integer
          format: int64
        vrDescCorrecao:
          type: number
          format: double
        vrDescJuros:
          type: number
          format: double
        vrDescMulta:
          type: number
          format: double
        vrDescPrincipal:
          type: number
          format: double
        vrAcrescimos:
          type: number
          format: double
        vrTotalAcordo:
          type: number
          format: double
        nrParcelas:
          type: integer
          format: int32
        cdAutorizacao:
          type: string
        negociador:
          type: string
        cdTipoAcordo:
          type: integer
          format: int32
        parcelasOriginais:
          type: array
          items:
            $ref: '#/components/schemas/IParcelaBase'
        parcelasAcordo:
          type: array
          items:
            $ref: '#/components/schemas/NegociadasAcordo'
    IParcelaBase:
      type: object
      properties:
        idDivida:
          type: string
        dtVencimento:
          type: string
          format: date-time
        vrParcela:
          type: number
          format: double
    NegociadasAcordo:
      type: object
      properties:
        sqParcela:
          type: integer
          format: int32
        dtVencimento:
          type: string
          format: date-time
        vrParcela:
          type: number
          format: double
        vrTxBoleta:
          type: number
          format: double
        vrTxDi:
          type: number
          format: double
        nrNossoNumero:
          type: integer
          format: int64
        vrDespesaCobranca:
          type: number
          format: double
    IRetornoDivida:
      type: object
      properties:
        nrProtocoloCarga:
          type: integer
          format: int64
        solicitante:
          type: string
        Dividas:
          type: array
          items:
            $ref: '#/components/schemas/IDividaCarga'
    IDividaCarga:
      type: object
      properties:
        nrInscricao:
          type: string
        tpPessoa:
          type: string
        cdPessoaCredor:
          type: string
        cdContrato:
          type: string
        dtContrato:
          type: string
          format: date-time
        pcJuros:
          type: string
        pcDesagio:
          type: string
        cdProdutoCredor:
          type: string
        cdSubProdutoCredor:
          type: string
        nome:
          type: string
        cdItemClassificao2:
          type: string
        parcelasDivida:
          type: array
          items:
            $ref: '#/components/schemas/IParcelaOriginal'
        enderecosPessoa:
          type: array
          items:
            $ref: '#/components/schemas/Enderecos'
        telefonesPessoa:
          type: array
          items:
            $ref: '#/components/schemas/Telefones'
        emailPessoa:
          type: array
          items:
            $ref: '#/components/schemas/Emails'
    IParcelaOriginal:
      type: object
      properties:
        idDivida:
          type: string
        nrBanco:
          type: string
        nrAgencia:
          type: string
        nrContaCorrente:
          type: string
        nrCheque:
          type: string
        dtLimiteAcordo:
          type: string
          format: date-time
        nomeLoja:
          type: string
        nrFilial:
          type: string
        vrOriginal:
          type: number
          format: double
        nrAlinea:
          type: string
        dtBaseNegociacao:
          type: string
          format: date-time
        nomeFantasia:
          type: string
        chequeProtestado:
          type: string
        dtVencimento:
          type: string
          format: date-time
        vrParcela:
          type: number
          format: double
    Enderecos:
      type: object
      properties:
        cdTipoEndereco:
