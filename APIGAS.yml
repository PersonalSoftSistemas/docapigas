      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdEndereco'
          text/json:
            schema:
              $ref: '#/components/schemas/MdEndereco'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MdEndereco'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Endereço criado com sucesso
          content: {}
        "400":
          description: UF inválida
          content: {}
        "500":
          description: Erro geral
          content: {}
      x-codegen-request-body-name: value
  /api/Negociacao/ObterOrigens/{Contrato}:
    get:
      tags:
      - Negociacao
      operationId: Negociacao_ObterOrigens
      parameters:
      - name: Contrato
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Lista das parcelas e dividas elegíveis para negociacao
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MdDividaOrigem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MdDividaOrigem'
        "400":
          description: Sem Dívida não encontrada
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Negociacao/Simular:
    post:
      tags:
      - Negociacao
      operationId: Negociacao_Simular
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdSimulacao'
          text/json:
            schema:
              $ref: '#/components/schemas/MdSimulacao'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MdSimulacao'
        required: true
      responses:
        "200":
          description: Dados da Simulação para posteriormente formalizar um acordo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdRetornoSimulacao'
            text/json:
              schema:
                $ref: '#/components/schemas/MdRetornoSimulacao'
        "400":
          description: "Contrato -Número do  Contrato- está em negociação com outro\
            \ usuário, tente novamente mais tarde"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
      x-codegen-request-body-name: value
  /api/Negociacao/AprovarSimulacao/{IdSimulacao}:
    post:
      tags:
      - Negociacao
      operationId: Negociacao_AprovarSimulacao
      parameters:
      - name: IdSimulacao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdAprovaAcordo'
          text/json:
            schema:
              $ref: '#/components/schemas/MdAprovaAcordo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MdAprovaAcordo'
        required: true
      responses:
        "200":
          description: Acordo Aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdRetonoAcordo'
            text/json:
              schema:
                $ref: '#/components/schemas/MdRetonoAcordo'
        "400":
          description: "Proposta vencida, realize nova simulação"
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
      x-codegen-request-body-name: value
  /api/Negociacao/Acordo/{ChaveNegociacao}:
    delete:
      tags:
      - Negociacao
      operationId: Negociacao_CancelarAcordo
      parameters:
      - name: ChaveNegociacao
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Acordo Cancelado com sucesso
          content: {}
        "400":
          description: Não é permitido o cancelamento do acordo
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Negociacao/Acordo/Boleto/{ChaveNegociacao}/{Parcela}:
    get:
      tags:
      - Negociacao
      operationId: Negociacao_Boleto
      parameters:
      - name: ChaveNegociacao
        in: path
        required: true
        schema:
          type: string
      - name: Parcela
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Boleto Emitido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdRetornoBoletoAssessoria'
            text/json:
              schema:
                $ref: '#/components/schemas/MdRetornoBoletoAssessoria'
        "400":
          description: Não é permitido o cancelamento do acordo
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: Erros internos
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Pagamento:
    get:
      tags:
