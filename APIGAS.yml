openapi: 3.0.1

info:
  title: webapigestaoassessorias
  version: v3
  description: >
    API de integração para Gestão de Assessoria – GAS.
    Contempla Carga, Acordo, Negociação, Pagamento, Retirada e Eventos.

servers:
  - url: https://api.exemplo.com

tags:
  - name: Acesso
  - name: Acordo
  - name: Carga
  - name: Evento
  - name: Localizacao
  - name: Negociacao
  - name: Pagamento
  - name: Retirada

paths:

  /api/acesso/token/{modulo}/{acesso}/{senha}:
    get:
      summary: Geração de token de acesso
      tags: [Acesso]
      parameters:
        - name: modulo
          in: path
          required: true
          schema: { type: integer }
        - name: acesso
          in: path
          required: true
          schema: { type: string }
        - name: senha
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }

  /api/Acordo:
    get:
      summary: Listar acordos
      tags: [Acordo]
      responses:
        '200':
          description: Lista de acordos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetornoAcordo' }

  /api/Acordo/{acesso}:
    get:
      summary: Listar acordos por acesso
      tags: [Acordo]
      parameters:
        - name: acesso
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lista de acordos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetornoAcordo' }

  /api/Carga:
    get:
      summary: Consultar cargas
      tags: [Carga]
      responses:
        '200':
          description: Cargas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetornoDivida' }

  /api/Carga/{acesso}:
    get:
      summary: Consultar cargas por acesso
      tags: [Carga]
      parameters:
        - name: acesso
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cargas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetornoDivida' }

  /api/Evento:
    get:
      summary: Listar eventos
      tags: [Evento]
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/clsBase' }

  /api/Evento/Acionamento/{Contrato}:
    post:
      summary: Lançar evento na dívida
      tags: [Evento]
      parameters:
        - name: Contrato
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcionamentoReduzido' }
      responses:
        '204':
          description: Evento lançado

  /api/Negociacao/TiposAcordo/{ChaveDivida}:
    get:
      summary: Tipos de acordo elegíveis
      tags: [Negociacao]
      parameters:
        - name: ChaveDivida
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tipos de acordo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/clsBase' }

  /api/Negociacao/ObterOrigens/{Contrato}:
    get:
      summary: Origens da dívida
      tags: [Negociacao]
      parameters:
        - name: Contrato
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Origens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MdDividaOrigem' }

  /api/Negociacao/Simular:
    post:
      summary: Simular negociação
      tags: [Negociacao]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MdSimulacao' }
      responses:
        '200':
          description: Resultado da simulação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MdRetornoSimulacao' }

  /api/Negociacao/AprovarSimulacao/{IdSimulacao}:
    post:
      summary: Aprovar simulação
      tags: [Negociacao]
      parameters:
        - name: IdSimulacao
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MdAprovaAcordo' }
      responses:
        '200':
          description: Acordo aprovado

  /api/Negociacao/Acordo/{ChaveNegociacao}:
    delete:
      summary: Cancelar acordo
      tags: [Negociacao]
      parameters:
        - name: ChaveNegociacao
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Acordo cancelado

  /api/Negociacao/Acordo/Boleto/{ChaveNegociacao}/{Parcela}:
    get:
      summary: Emitir boleto
      tags: [Negociacao]
      parameters:
        - name: ChaveNegociacao
          in: path
          required: true
          schema: { type: string }
        - name: Parcela
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Boleto gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MdRetornoBoletoAssessoria' }

  /api/Negociacao/Acordo/status/{SqAcordo}:
    get:
      summary: Status do acordo
      tags: [Negociacao]
      parameters:
        - name: SqAcordo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MdDadosAcordo' }

  /api/Pagamento:
    get:
      summary: Listar pagamentos
      tags: [Pagamento]
      responses:
        '200':
          description: Pagamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetornoPagamento' }

  /api/Retirada:
    get:
      summary: Listar retiradas
      tags: [Retirada]
      responses:
        '200':
          description: Retiradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IRetirada' }

components:
  schemas:

    AccessToken:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }

    IRetornoAcordo:
      type: object

    IRetornoDivida:
      type: object

    IRetornoPagamento:
      type: object

    IRetirada:
      type: object

    clsBase:
      type: object
      properties:
        codigo: { type: integer }
        nome: { type: string }

    AcionamentoReduzido:
      type: object

  MdDividaOrigem:
    type: object
    properties:
      ChaveDivida:
        type: string
        example: DIV-123456
      Contrato:
        type: string
        example: CTR-998877
      Produto:
        type: string
        example: Cartão de Crédito
      Parcelas:
        type: array
        items:
          $ref: '#/components/schemas/MdPOOrigem'
  MdPOOrigem:
    type: object
    properties:
      IdParcela:
        type: string
        example: PARC-1
      ChavePO:
        type: string
        example: PO-98765
      DtVencimento:
        type: string
        format: date-time
        example: '2025-12-10T00:00:00'
      NrTitulo:
        type: string
        example: TIT-445566
      VrPrincipal:
        type: number
        format: double
        example: 350.75
  MdSimulacao:
    type: object
    required:
      - QtParcelas
      - TipoAcordo
      - DtPrimeiroVencimento
      - Origens
    properties:
      QtParcelas:
        type: integer
        example: 3
      TipoAcordo:
        type: integer
        example: 1
      DtPrimeiroVencimento:
        type: string
        format: date-time
        example: '2026-01-10T00:00:00'
      PrimeiraParcela:
        $ref: '#/components/schemas/MdEntrada'
      PcDescontoAplicado:
        type: number
        format: double
        example: 20.0
      Origens:
        type: array
        items:
          $ref: '#/components/schemas/MdBaseDividaOrigem'
  MdEntrada:
    type: object
    properties:
      DtEntrada:
        type: string
        format: date-time
        example: '2025-12-05T00:00:00'
      VrEntrada:
        type: number
        format: double
        example: 150.00
  MdBaseDividaOrigem:
    type: object
    properties:
      ChaveDivida:
        type: string
        example: DIV-123456
      Contrato:
        type: string
        example: CTR-998877
  MdRetornoSimulacao:
    type: object
    properties:
      IdSimulacao:
        type: string
        example: SIM-000123
      DtValidade:
        type: string
        format: date-time
        example: '2026-01-31T23:59:59'
      Descontos:
        $ref: '#/components/schemas/MdDescontos'
      ParcelasAcordo:
        type: array
        items:
          $ref: '#/components/schemas/MdParcelaAcordo'
  MdDescontos:
    type: object
    properties:
      Principal:
        $ref: '#/components/schemas/MdBaseDescontos'
      Juros:
        $ref: '#/components/schemas/MdBaseDescontos'
      Multa:
        $ref: '#/components/schemas/MdBaseDescontos'
      Correcao:
        $ref: '#/components/schemas/MdBaseDescontos'
  MdBaseDescontos:
    type: object
    properties:
      ValorDevido:
        type: number
        format: double
        example: 500.00
      ValorDesconto:
        type: number
        format: double
        example: 100.00
      PercentualAplicado:
        type: number
        format: double
        example: 20.0
      ValorCobrado:
        type: number
        format: double
        example: 400.00
  MdParcelaAcordo:
    type: object
    properties:
      SqParcela:
        type: integer
        example: 1
      DtVencimento:
        type: string
        format: date-time
        example: '2026-01-10T00:00:00'
      VrParcela:
        type: number
        format: double
        example: 180.00
      VrAcrescimos:
        type: number
        format: double
        example: 5.50
      VrTotal:
        type: number
        format: double
        example: 185.50
  MdAprovaAcordo:
    type: object
    required:
      - LoginNegociador
    properties:
      LoginNegociador:
        type: string
        example: operador01
  MdRetornoBoletoAssessoria:
    type: object
    properties:
      SqParcelaCredor:
        type: integer
        example: 12345
      LinhaDigitavel:
        type: string
        example: 34191.79001 01043.510047 91020.150008 1 88940000018550
      CodigoBarras:
        type: string
        example: 3419188940000018550
      DtVencimento:
        type: string
        format: date-time
        example: '2026-01-10T00:00:00'
      VlBoleta:
        type: number
        format: double
        example: 185.50
  MdDadosAcordo:
    type: object
    properties:
      ChaveNegociacao:
        type: string
        example: NEG-998877
      SqAcordo:
        type: string
        example: 556677
      Negociador:
        type: string
        example: operador01
      StatusAcordo:
        type: integer
        enum: [0, 1, 2]
        example: 1
      StatusAcordoDescricao:
        type: string
        example: Ativo
  clsBase:
    type: object
    properties:
      codigo:
        type: integer
        example: 1
      nome:
        type: string
        example: À Vista
      InDesativado:
        type: boolean
        example: false
