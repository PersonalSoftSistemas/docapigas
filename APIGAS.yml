      responses:
        "200":
          description: Cargas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IRetornoDivida'
            text/json:
              schema:
                $ref: '#/components/schemas/IRetornoDivida'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
  /api/Carga/{acesso}:
    get:
      tags:
      - Carga
      operationId: Carga_CargaLogin
      parameters:
      - name: acesso
        in: path
        required: true
        schema:
