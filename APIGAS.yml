              $ref: '#/components/schemas/MdTelefone'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        "204":
          description: Telefone criado com sucesso
          content: {}
        "400":
          description: Erro ao salvar Telefone do cliente DDD e Telefone já cadastrado
            para este cliente
          content: {}
        "500":
          description: Erro geral
          content: {}
      x-codegen-request-body-name: value
  /api/Localizacao/Endereco/TipoEndereco:
    get:
      tags:
      - LocalizacaoEndereco
      operationId: Localizacao_ListaTipoEndereco
      responses:
        "200":
          description: Lista de Tipo Endereço
          content:
            application/json:
              schema:
